<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFT-Preview</title>
    <link rel="stylesheet" href="estilo/style.css">
    <link rel="shortcut icon" href="./imagens/icon-favicon.png" type="image/x-icon">
</head>
<body>
    <div class="card">
        <div class="img-card">
            <img src="./imagens/image-equilibrium.jpg" alt="img-card">

            <div class="img-overlay">
                <img src="./imagens/icon-view.svg" alt="view icon">
            </div>
        </div>
        
        <h2>Equilibrium #3429</h2>
        
          <p>Our Equilibrium collection promotes balance and calm.</p>
        
          <div class="eth">
              <p>
             <img src="./imagens/icon-ethereum.svg" alt=""> 0.041 ETH
            </p>
              <p class="days">
                <img src="./imagens/icon-clock.svg" alt=""> 3 days left
              </p>
          </div>

          <div class="line-bottom"></div>
          
          <div class="avatar">
              <img src="./imagens/image-avatar.png" alt="avatar">
              <p>Creation of <span>Jules Wyvern</span></p>
        </div>
    </div>
</body>
</html>
